[project]
name = "modbusai"
version = "0.2.0"
description = "Outil de diagnostic Modbus RTU / RS-485"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"modbusai/analysis/diagnostic.py" = ["E501"]  # libellés d'hypothèses en français
"modbusai/analysis/stress.py" = ["E501"]
"modbusai/analysis/report.py" = ["E501"]
"modbusai/i18n_en.py" = ["E501"]  # dictionnaire de traduction
"modbusai/ui/style.py" = ["E501"]  # feuille de style
"modbusai/ui/widgets/about_dialog.py" = ["E501"]  # mode d'emploi

[project]
name = "modbusai"
version = "0.1.0"
description = "Outil de diagnostic Modbus RTU / RS-485"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

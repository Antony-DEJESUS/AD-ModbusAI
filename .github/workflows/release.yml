# Publication : un tag « vX.Y.Z » construit les deux exécutables Windows et
# crée la release, avec le mode d'emploi et la section du CHANGELOG en corps.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# Le tag doit porter la version de modbusai/__init__.py, sinon la publication
# s'arrête : un exécutable mal nommé se retrouverait sinon en ligne.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier, par exemple v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bibliothèques Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Dépendances
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Le tag s'accorde avec la version du paquet
        run: python tools/release_notes.py --check "${{ github.event.inputs.tag || github.ref_name }}"
      - name: Lint
        run: ruff check .
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  construire:
    needs: verifier
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dépendances
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Exécutables
        run: pyinstaller packaging/modbusai.spec --noconfirm

      # Le serveur MCP doit répondre : un exécutable qui ne parle pas le
      # protocole ne doit pas sortir.
      - name: Le serveur MCP répond
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist/AD-ModbusAI-MCP_*.exe)[0].FullName
          $msg = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}'
          $out = $msg | & $exe
          if ($out -notmatch '"serverInfo"') { throw "Poignée de main MCP absente : $out" }
          Write-Host "Poignée de main MCP correcte."

      - name: Corps de la release
        shell: bash
        run: python tools/release_notes.py > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: executables
          path: dist/*.exe

      - name: Publier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          manuel="docs/AD-ModbusAI_Mode_d_emploi_v${version}.pdf"
          # Le mode d'emploi de CETTE version, jamais un PDF resté d'une
          # précédente : une release ne doit pas livrer une notice périmée.
          if [ ! -f "$manuel" ]; then
            echo "Mode d'emploi absent : $manuel — lancer docs/manuel/build_manuel.py" >&2
            exit 1
          fi
          fichiers=(dist/*.exe "$manuel")
          if gh release view "$tag" >/dev/null 2>&1; then
            # Relance sur un tag déjà publié : on remplace les fichiers.
            gh release upload "$tag" "${fichiers[@]}" --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file notes.md "${fichiers[@]}"
          fi
